services:
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      TZ: Asia/Tokyo
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./bot
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml
